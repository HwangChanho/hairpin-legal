<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>헤어핀 다운로드</title>
<meta name="description" content="미용사용 고객관리 앱 헤어핀. 컬러차트 483색, 보색 중화, 시술 기록, 매출·가계부.">

<!-- 링크 공유(스레드·인스타·카톡) 시 보이는 카드 -->
<meta property="og:title" content="헤어핀 — 미용사용 고객관리 앱">
<meta property="og:description" content="컬러차트 483색 · 보색 중화 · 시술 기록 · 매출·가계부 · AI 헤어스타일">
<meta property="og:type" content="website">
<meta property="og:url" content="https://hwangchanho.github.io/hairpin-legal/get.html">
<meta property="og:image" content="https://hwangchanho.github.io/hairpin-legal/hairpin-og.png">
<meta name="twitter:card" content="summary_large_image">

<style>
  :root {
    --ground: #ECE6DF;   /* 앱 스플래시 배경과 같은 값 */
    --ink:    #2A211F;
    --ink-2:  #6B5B57;
    --accent: #7E545B;   /* 앱 알림 색 */
    --line:   #D9CFC5;
    --surface:#FAF7F3;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    min-height: 100dvh;
    background: var(--ground);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
                 "Noto Sans KR", "Malgun Gothic", sans-serif;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    padding: 40px 24px calc(40px + env(safe-area-inset-bottom));
    text-align: center;
    line-height: 1.6;
  }
  .logo {
    width: 108px; height: 108px; border-radius: 50%;
    background: var(--surface) center/78% no-repeat url("hairpin-mark.png");
    box-shadow: 0 1px 3px rgba(0,0,0,.08);
    margin-bottom: 26px;
  }
  h1 { font-size: 30px; font-weight: 700; letter-spacing: -.02em; margin-bottom: 10px; }
  .tagline { font-size: 16px; color: var(--ink-2); margin-bottom: 6px; }
  .feats {
    font-size: 14px; color: var(--ink-2); margin-bottom: 34px;
    max-width: 20rem; word-break: keep-all;
  }

  .btns { display: flex; flex-direction: column; gap: 12px; width: 100%; max-width: 320px; }
  a.btn {
    display: flex; align-items: center; justify-content: center; gap: 9px;
    padding: 17px 20px; border-radius: 14px;
    font-size: 17px; font-weight: 600; text-decoration: none;
    background: var(--ink); color: var(--ground);
    transition: transform .12s ease, opacity .12s ease;
  }
  a.btn:active { transform: scale(.98); opacity: .9; }
  a.btn.secondary {
    background: transparent; color: var(--ink);
    box-shadow: inset 0 0 0 1.5px var(--line);
  }
  a.btn svg { width: 20px; height: 20px; flex: none; fill: currentColor; }

  /* 기기가 감지되면 해당 버튼만 남기고 나머지는 보조로 내린다 */
  .note { margin-top: 26px; font-size: 13px; color: var(--ink-2); }
  .note a { color: var(--accent); text-underline-offset: 3px; }
  footer { margin-top: 40px; font-size: 12px; color: var(--ink-2); opacity: .75; }
  footer a { color: inherit; text-underline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { a.btn { transition: none; } }
</style>
</head>
<body>

  <div class="logo" role="img" aria-label="헤어핀 로고"></div>

  <h1>헤어핀</h1>
  <p class="tagline">미용사용 고객관리 앱</p>
  <p class="feats">컬러차트 483색 · 보색 중화 · 시술 기록<br>매출·가계부 · AI 헤어스타일 · 대화 번역</p>

  <div class="btns" id="btns">
    <a class="btn" id="ios" href="https://apps.apple.com/kr/app/id6777420253">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.05 12.54c-.02-2.2 1.8-3.26 1.88-3.31-1.02-1.5-2.61-1.7-3.18-1.73-1.35-.14-2.64.8-3.33.8-.69 0-1.75-.78-2.87-.76-1.48.02-2.84.86-3.6 2.18-1.53 2.66-.39 6.6 1.1 8.76.73 1.06 1.6 2.25 2.74 2.2 1.1-.04 1.51-.71 2.84-.71 1.32 0 1.7.71 2.86.69 1.18-.02 1.93-1.08 2.65-2.14.84-1.23 1.18-2.42 1.2-2.48-.03-.01-2.3-.88-2.32-3.5zM14.9 5.3c.6-.74 1.01-1.76.9-2.79-.87.04-1.93.58-2.56 1.31-.56.65-1.06 1.7-.93 2.7.97.08 1.97-.49 2.59-1.22z"/></svg>
      App Store에서 받기
    </a>
    <a class="btn secondary" id="android" href="https://play.google.com/store/apps/details?id=com.hairbook.app">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.6 1.84a1 1 0 00-.5.87v18.58a1 1 0 00.5.87l10-10.16-10-10.16zM16.9 8.3L5.8 1.94l8.9 9.04 2.2-2.68zM20.5 11.1l-2.4-1.37-2.44 2.98 2.44 2.44 2.4-1.37a1.35 1.35 0 000-2.68zM14.7 13.9l-8.9 8.16 11.1-6.36-2.2-1.8z"/></svg>
      Google Play에서 받기
    </a>
  </div>

  <p class="note" id="note"></p>

  <footer>
    <a href="privacy.html">개인정보처리방침</a> · <a href="support.html">문의</a>
  </footer>

<script>
// ---------------------------------------------------------------------------
// 기기에 맞는 스토어를 위로 올린다.
//
// 자동 리다이렉트는 하지 않는다 — 잘못 감지하면 엉뚱한 스토어로 보내고,
// 인스타·스레드의 인앱 브라우저에서는 리다이렉트가 막히거나 빈 화면이 되는 일이 잦다.
// 대신 맞는 버튼을 첫째로 올리고 나머지를 보조 스타일로 내린다.
// ---------------------------------------------------------------------------
(function () {
  var ua = navigator.userAgent || "";
  var isIOS = /iPad|iPhone|iPod/.test(ua) ||
              // iPadOS 13+ 는 데스크톱 사파리로 위장하므로 터치 지원으로 가른다
              (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  var isAndroid = /Android/.test(ua);

  var btns = document.getElementById("btns");
  var ios = document.getElementById("ios");
  var android = document.getElementById("android");
  var note = document.getElementById("note");

  if (isAndroid) {
    // 안드로이드를 첫째로
    btns.insertBefore(android, ios);
    android.className = "btn";
    ios.className = "btn secondary";
  } else if (!isIOS) {
    // 데스크톱: 어느 쪽도 강조하지 않고 둘 다 같은 무게로
    ios.className = "btn secondary";
    note.textContent = "폰으로 열면 바로 설치할 수 있어요";
  }
})();
</script>
</body>
</html>
